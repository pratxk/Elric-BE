[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elric-backend"
version = "0.1.0"
description = "Elric — accounts-payable invoice processing agent (scaffold)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    # Postgres driver (binary wheels bundle libpq — the slim image has
    # no system libpq). Required once DATABASE_URL points at Neon;
    # without it the app fails to boot (psycopg itself is only a
    # transitive dep of langgraph-checkpoint-postgres, with no pq
    # wrapper). The URL must use the postgresql+psycopg:// scheme.
    "psycopg[binary]>=3.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
